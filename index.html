<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع تحت الصيانة</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            margin-top: 50px;
        }
        h1 {
            color: #333;
        }
        canvas {
            background: linear-gradient(to bottom, #87CEEB, #fff);
            display: block;
            margin: 20px auto;
            border: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .score {
            font-size: 20px;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚧 الموقع تحت الصيانة 🚧</h1>
        <p>نحن نعمل على تحسين الموقع. يمكنك اللعب أثناء الانتظار! 🎮</p>
        <canvas id="gameCanvas" width="400" height="300"></canvas>
        <div class="score" id="score">النقاط: 0</div>
    </div>
    
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let player = { x: 50, y: 250, width: 20, height: 20, dy: 0 };
        let gravity = 0.5;
        let isJumping = false;
        let score = 0;
        let obstacles = [];
        let gameOver = false;

        // رسم اللاعب
        function drawPlayer() {
            ctx.fillStyle = "blue";
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        // رسم الأرض
        function drawGround() {
            ctx.fillStyle = "#8B4513";
            ctx.fillRect(0, 270, canvas.width, 30);
        }

        // تحديث حالة اللاعب
        function updatePlayer() {
            if (isJumping) {
                player.dy -= gravity;
            } else {
                player.dy += gravity;
            }
            player.y += player.dy;

            if (player.y >= 250) {
                player.y = 250;
                isJumping = false;
            }
        }

        // إنشاء العوائق
        function createObstacle() {
            if (Math.random() < 0.02) {
                obstacles.push({ x: canvas.width, y: 250, width: 20, height: 20 });
            }
        }

        // رسم العوائق
        function drawObstacles() {
            ctx.fillStyle = "red";
            obstacles.forEach(obstacle => {
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            });
        }

        // تحديث العوائق
        function updateObstacles() {
            obstacles.forEach((obstacle, index) => {
                obstacle.x -= 4;

                // التحقق من التصادم
                if (
                    player.x < obstacle.x + obstacle.width &&
                    player.x + player.width > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.height > obstacle.y
                ) {
                    gameOver = true;
                }

                // إزالة العوائق التي خرجت من الشاشة
                if (obstacle.x + obstacle.width < 0) {
                    obstacles.splice(index, 1);
                    score++;
                }
            });
        }

        // حلقة اللعبة
        function gameLoop() {
            if (gameOver) {
                alert(`انتهت اللعبة! النقاط: ${score}`);
                document.location.reload();
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGround();
            drawPlayer();
            updatePlayer();
            createObstacle();
            drawObstacles();
            updateObstacles();

            document.getElementById("score").innerText = `النقاط: ${score}`;
            requestAnimationFrame(gameLoop);
        }

        // التحكم بالقفز
        document.addEventListener("keydown", function(event) {
            if (event.code === "Space" && player.y >= 250) {
                isJumping = true;
                player.dy = -8;
            }
        });

        // بدء اللعبة
        gameLoop();
    </script>
</body>
</html>
