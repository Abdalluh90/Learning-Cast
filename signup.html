<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Learning Cast</title>
    <link rel="stylesheet" href="signup.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="signup-container">
        <div class="signup-box">
            <h2><i class="fas fa-user-plus"></i> إنشاء حساب جديد</h2>
            <form class="signup-form" novalidate>
                <!-- First Name -->
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="first-name" placeholder="الاسم الأول" required autocomplete="given-name">
                </div>

                <!-- Last Name -->
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="last-name" placeholder="الاسم الأخير" required autocomplete="family-name">
                </div>

                <!-- Email -->
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="البريد الإلكتروني" required autocomplete="email">
                </div>

                <!-- Phone Number -->
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="phone" placeholder="رقم الهاتف" required autocomplete="tel">
                </div>

                <!-- Birthdate -->
                <div class="input-group">
                    <i class="fas fa-calendar-alt"></i>
                    <input type="date" id="birthdate" required autocomplete="bday">
                </div>

                <!-- Gender -->
                <div class="input-group">
                    <i class="fas fa-venus-mars"></i>
                    <select id="gender" required>
                        <option value="" disabled selected>اختر النوع</option>
                        <option value="male">ذكر</option>
                        <option value="female">أنثى</option>
                    </select>
                </div>

                <!-- Password -->
                <div class="input-group password-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="كلمة المرور" required autocomplete="new-password">
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirm-password" placeholder="تأكيد كلمة المرور" required autocomplete="new-password">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="signup-btn">إنشاء الحساب</button>

                <!-- Login Link -->
                <p class="login-link">لديك حساب؟ <a href="login.html"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</a></p>
            </form>
        </div>
    </div>
    <script src="signup.js"></script>
</body>
</html>
